<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>One Week at a Time</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: Week = a row of day boxes (past days shrink to strips; scrolls sideways on phones), Month = grid, Day = one page.
   Bold grotesk type, ink on warm grey, red for today, pastel highlights for categories. */
:root{
  --bg:#f7f5f8; --surface:#f8f7f4; --sunk:#e7dee7; --seg:#eae5ea; --fg:#141414; --muted:#6d6b66; --faint:#a9a6a0; --rule:#d3d0c9;
  --accent:#141414; --accent-soft:#dcdad4; --today:#be509b; --today-line:#db87c0; --today-border:#eca3d9; --today-soft:#f6dcef;
  --hl-goal:#dcd5fb; --hl-must:#f2cfd5; --hl-job:#bde9f0; --hl-side:#f8ec97; --hl-prac:#c3f0d6; --hl-study:#c7e2fa; --hl-peach:#fbd6bd;
  --display:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif; --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#22221f; --sunk:#1c1c1a; --seg:#1c1c1a; --fg:#efeee9; --muted:#a3a19b; --faint:#64625d; --rule:#33322e;
  --accent:#efeee9; --accent-soft:#2c2b28; --today:#ee8acb; --today-line:#b9659f; --today-border:#8a4a78; --today-soft:#3a1f33;
  --hl-goal:#3a3358; --hl-must:#4f2a31; --hl-job:#1f4750; --hl-side:#4b4419; --hl-prac:#1f4a33; --hl-study:#21405a; --hl-peach:#4e3122; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#22221f; --sunk:#1c1c1a; --seg:#1c1c1a; --fg:#efeee9; --muted:#a3a19b; --faint:#64625d; --rule:#33322e;
  --accent:#efeee9; --accent-soft:#2c2b28; --today:#ee8acb; --today-line:#b9659f; --today-border:#8a4a78; --today-soft:#3a1f33;
  --hl-goal:#3a3358; --hl-must:#4f2a31; --hl-job:#1f4750; --hl-side:#4b4419; --hl-prac:#1f4a33; --hl-study:#21405a; --hl-peach:#4e3122; color-scheme:dark}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.narrow{max-width:680px;width:100%}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1}
h2{font-size:1.3rem}
h3{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
section{display:grid;gap:12px;min-width:0}
main{min-width:0;display:grid;gap:16px}
ul{list-style:none;margin:0;padding:0}
button,select{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);padding:6px 10px;font-size:.85rem}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
button.link{border:none;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:.85rem}

/* Top bar */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.titlebox{display:grid;gap:2px}
.rel{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:2px;background:var(--seg);padding:3px;border-radius:10px}
.seg button{border:none;background:transparent;padding:6px 12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.round{width:38px;height:38px;padding:0;border-radius:50%;font-size:1.1rem;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.round:hover{opacity:.8}
.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.sync{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dotline{display:inline-flex;align-items:center;gap:6px}
.dotline::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dotline.on::before{background:var(--accent)}
.signin{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.signin input{flex:1 1 180px;min-width:0;font:inherit;font-size:.9rem;padding:7px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--fg)}
details.goals summary{cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.goals summary::-webkit-details-marker{display:none}
details.goals summary::after{content:"▾";font-size:.75rem}
details.goals[open] summary::after{content:"▴"}
details.goals ul{margin-top:8px;display:grid;gap:4px}
.goals li{font-weight:600;font-size:1rem;color:var(--fg);display:flex;gap:8px;align-items:baseline}
.goals li::before{content:"→";color:var(--accent);font-family:var(--body)}
.notice{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice span{flex:1 1 200px}

/* Ruled lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:6px;min-height:42px;border-bottom:1px solid var(--rule);padding:0 2px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row.filler{pointer-events:none}
.row .rt{flex:1;min-width:0;border:none;background:none;padding:6px 0;text-align:left;font-size:.95rem;color:var(--fg);cursor:pointer;border-radius:0}
.hl{padding:2px 7px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.7}
.hl[data-c=goal]{background:var(--hl-goal)}.hl[data-c=must]{background:var(--hl-must)}.hl[data-c=job]{background:var(--hl-job)}
.hl[data-c=side]{background:var(--hl-side)}.hl[data-c=prac]{background:var(--hl-prac)}.hl[data-c=study]{background:var(--hl-study)}
.hl[data-c=peach]{background:var(--hl-peach)}.hl[data-c=ink]{background:var(--fg);color:var(--bg)}
.hl[data-c=plain]{padding-left:0}
.cdot{width:14px;height:14px;flex:none;padding:0;border-radius:50%;border:1.5px solid transparent;cursor:pointer}
.cdot[data-c=plain]{border-color:var(--faint);background:transparent}
.cdot:hover{transform:scale(1.2)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:8px 2px 10px;border-bottom:1px solid var(--rule)}
.swatch{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid transparent}
.swatch[data-c=plain]{border:1.5px dashed var(--faint);background:transparent}
.swatch[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}
[data-c=goal].cdot,[data-c=goal].swatch{background:var(--hl-goal)}[data-c=must].cdot,[data-c=must].swatch{background:var(--hl-must)}
[data-c=job].cdot,[data-c=job].swatch{background:var(--hl-job)}[data-c=side].cdot,[data-c=side].swatch{background:var(--hl-side)}
[data-c=prac].cdot,[data-c=prac].swatch{background:var(--hl-prac)}[data-c=study].cdot,[data-c=study].swatch{background:var(--hl-study)}
[data-c=peach].cdot,[data-c=peach].swatch{background:var(--hl-peach)}[data-c=ink].cdot,[data-c=ink].swatch{background:var(--fg)}
.footrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.themebtn{border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--rule)}
.foot{display:grid;gap:8px;border-top:1px solid var(--rule);padding-top:16px;font-size:.85rem;color:var(--muted)}
.star{color:var(--today);margin-right:4px}
.row.done .rt{color:var(--faint);text-decoration:line-through}
.row.done .hl{background:transparent}
.chk{width:24px;height:24px;flex:none;padding:0;border-radius:50%;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;font-size:.75rem;color:transparent}
.chk:hover{border-color:var(--accent);color:var(--accent)}
.row.done .chk{background:var(--faint);border-color:var(--faint);color:var(--bg)}
.grip{touch-action:none;cursor:grab;color:var(--faint);font-size:1.05rem;line-height:1;padding:8px 4px;flex:none}
@media (hover:hover) and (pointer:fine){.grip{display:none}.row{cursor:grab}.row .rt{padding-left:4px}}
.addline{display:flex;align-items:center;min-height:42px;border-bottom:1px solid var(--rule)}
.addline input{flex:1;min-width:0;border:none;background:transparent;font:inherit;font-size:.95rem;color:var(--fg);padding:8px 2px 8px 22px}
.addline input::placeholder{color:var(--faint)}
.addline input:focus{outline:none;background:var(--surface)}
.menu{display:grid;gap:8px;padding:10px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin:6px 0 8px;box-shadow:0 6px 18px rgba(0,0,0,.08);cursor:default;user-select:text}
.menu input{font:inherit;font-size:.95rem;padding:7px 9px;border-radius:7px;border:1px solid var(--rule);background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font-size:.78rem;padding:4px 9px;border-radius:999px}
.chips button[aria-pressed=true]{border-color:var(--fg);border-width:1.5px;font-weight:700}
.chips .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

/* Week view: day boxes */
.board{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.colm{flex:1 0 160px;min-width:160px;background:var(--sunk);border-radius:14px;padding:12px 10px 8px;display:flex;flex-direction:column;gap:4px;min-height:300px;border:2px solid transparent;box-sizing:border-box}
.colm.today{background:var(--surface);border-color:var(--today-border)}
.colm.dim{opacity:.6}
.colm.mini{flex:0 0 48px;min-width:48px;padding:12px 4px;align-items:center;cursor:pointer;opacity:.55}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:4px;padding:0 2px 7px;border-bottom:2px solid var(--fg);cursor:pointer}
.dnum{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dwk{font-size:.85rem;color:var(--faint);font-weight:600}
.colm.today .chead{border-color:var(--today-line)}
.colm.today .dnum,.colm.today .dwk{color:var(--today)}
.colm.mini .chead{flex-direction:column-reverse;align-items:center;border:none;padding:0;gap:0}
.colm.mini .dnum{font-size:1.05rem}
.dots{display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.dot.d{background:var(--muted)}
.colm .row{min-height:38px;padding:0}
.colm .row .rt{font-size:.9rem}
.colm .chk{width:20px;height:20px}
.colm .cdot{width:10px;height:10px}
.colm .row{gap:5px}
.colm .addline{border-bottom:none}
.colm .addline input{padding-left:2px;font-size:.88rem}
.over{border-color:var(--fg)!important;border-style:dashed!important}
.anyblk{display:grid;gap:8px;border-radius:14px;border:2px dashed var(--rule);padding:12px 14px}
.anycols{columns:3 240px;column-gap:18px}
.anycols .row,.anycols .addline{break-inside:avoid}
.pastline{display:none}

/* Month view */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--fg)}
.mwd{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--rule)}
.mcell{min-height:104px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:4px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0;border-left:2px solid transparent}
.mcell:nth-child(7n){border-right:none}
.mcell.out{opacity:.4}
.mcell.past .mn{color:var(--faint)}
.mn{font-family:var(--display);font-weight:600;font-size:.95rem;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.mcell.today .mn{background:var(--today);color:var(--bg)}
.mchip{font-size:.72rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 4px}
.mchip.done{text-decoration:line-through;color:var(--faint);background:transparent!important}
.mchip[data-c=goal]{background:var(--hl-goal)}.mchip[data-c=must]{background:var(--hl-must)}.mchip[data-c=job]{background:var(--hl-job)}
.mchip[data-c=peach]{background:var(--hl-peach)}.mchip[data-c=ink]{background:var(--fg);color:var(--bg)}
.mchip[data-c=side]{background:var(--hl-side)}.mchip[data-c=prac]{background:var(--hl-prac)}.mchip[data-c=study]{background:var(--hl-study)}
.mmore{font-size:.7rem;color:var(--muted)}
@media (max-width:560px){.mcell{min-height:78px;padding:3px 2px}.mchip{font-size:.62rem;padding:0 2px}}

/* Day view with time blocking */
.dayview2{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:720px){.dayview2{grid-template-columns:minmax(0,1fr)}}
.dv-side{display:grid;gap:12px;align-content:start;min-width:0}
.dv-side .dayblk{border-radius:14px;background:var(--sunk);padding:4px 10px 6px;margin:0;border:2px solid transparent}
.dv-side .dayblk .addline{border-bottom:none}
.dv-side .dayblk .addline input{padding-left:2px}
.tlhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.timeline{position:relative;cursor:copy;border-radius:6px;border:2px solid transparent;margin:-2px}
.hr{position:absolute;left:0;right:0;height:60px;border-top:1px solid var(--rule);pointer-events:none}
.hr::after{content:"";position:absolute;left:52px;right:0;top:30px;border-top:1px dashed var(--rule);opacity:.7}
.hr span{position:absolute;left:0;top:-8px;font-size:.72rem;font-weight:600;color:var(--muted);background:var(--bg);padding-right:6px;font-variant-numeric:tabular-nums}
.tl-area{position:absolute;left:52px;right:0;top:0;bottom:0}
.blk{position:absolute;box-sizing:border-box;border-radius:8px;padding:3px 4px 6px 7px;display:flex;gap:4px;align-items:flex-start;overflow:hidden;background:var(--surface);border:1px solid var(--rule);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;z-index:2;color:var(--fg)}
.blk[data-c=goal]{background:var(--hl-goal);border-color:transparent}.blk[data-c=must]{background:var(--hl-must);border-color:transparent}
.blk[data-c=job]{background:var(--hl-job);border-color:transparent}.blk[data-c=side]{background:var(--hl-side);border-color:transparent}
.blk[data-c=prac]{background:var(--hl-prac);border-color:transparent}.blk[data-c=study]{background:var(--hl-study);border-color:transparent}
.blk[data-c=peach]{background:var(--hl-peach);border-color:transparent}.blk[data-c=ink]{background:var(--fg);color:var(--bg);border-color:transparent}
.blk .bt{flex:1;min-width:0;border:none;background:none;padding:0;text-align:left;color:inherit;display:grid;line-height:1.2;cursor:pointer}
.btime{font-size:.7rem;font-weight:700;opacity:.65;font-variant-numeric:tabular-nums}
.btxt{font-size:.88rem;font-weight:500;overflow-wrap:anywhere}
.blk.done .btxt{text-decoration:line-through;opacity:.55}
.blk .chk{width:20px;height:20px;border-color:currentColor;border-width:1.5px;flex:none}
.blk .grip{padding:2px}
.rsz{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none}
.rsz::after{content:"";position:absolute;left:50%;bottom:3px;width:26px;height:3px;border-radius:2px;background:currentColor;opacity:.35;transform:translateX(-50%)}
.nowl{position:absolute;left:-4px;right:0;height:2px;background:var(--today);z-index:3;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--today)}
.qadd{position:absolute;left:0;right:0;z-index:4}
.qadd input{width:100%;box-sizing:border-box;font:inherit;font-size:.92rem;padding:8px 10px;border-radius:8px;border:2px solid var(--fg);background:var(--surface);color:var(--fg)}
.blkmenu{position:absolute;left:0;right:0;z-index:5}
/* Day view */
.dayview{display:grid;gap:22px}
.dayview .row{min-height:52px}
.dayview .row .rt{font-size:1.08rem}
.dayview .addline{min-height:52px}
.dayview .addline input{font-size:1.08rem}

.rhythm li{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;gap:8px;margin-bottom:8px}
.rtop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{width:34px;height:34px;padding:0;border-radius:50%;font-size:.78rem;font-weight:700;color:var(--muted)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.day.now{border-color:var(--today);border-width:2px}
.x{border:none;background:none;color:var(--muted);padding:2px 6px}
.dumpblk{border-radius:12px;border:2px solid transparent;padding:6px;margin:-8px}
.hint{color:var(--muted);font-size:.88rem;margin:0}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.2);transform:rotate(2deg);background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:7px 10px;font-size:.92rem;max-width:220px}
.lifting{opacity:.35}
@media (prefers-reduced-motion:reduce){.ghost{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="titlebox"><span class="rel" id="rel"></span><h1 id="title">…</h1></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="View">
        <button data-a="view" data-v="week">Week</button>
        <button data-a="view" data-v="month">Month</button>
        <button data-a="view" data-v="day">Day</button>
      </div>
      <button data-a="today" id="todayBtn">Today</button>
      <button class="round" data-a="prev" aria-label="Back">‹</button>
      <button class="round" data-a="next" aria-label="Forward">›</button>
    </div>
  </div>
  <div class="meta">
    <details class="goals" id="goalBox"><summary id="goalSum">⭐ Where this is going</summary><ul id="goalList"></ul></details>
  </div>
  <div id="noticeArea"></div>

  <main id="view"></main>

  <section class="dumpblk narrow" data-drop="dump" aria-labelledby="bd">
    <div class="rtop"><h2 id="bd">🧠 Brain dump</h2><span class="hint" id="bdCount"></span></div>
    <p class="hint">Everything that isn't on a day yet. Drag it onto a day when you're ready.</p>
    <ul class="rows" id="dumpList"></ul>
  </section>

  <section class="rhythm narrow" aria-labelledby="rh">
    <div class="rtop"><h2 id="rh">🌿 Practices &amp; studies</h2></div>
    <p class="hint">Tap a day when you did it. No target, just a record.</p>
    <ul id="rhythmList"></ul>
    <form class="signin" id="rForm"><input id="rNew" placeholder="Add a practice or study…" autocomplete="off" aria-label="New practice"><select id="rCat" aria-label="Type"><option value="prac">Practice</option><option value="study">Study</option></select><button type="submit">Add</button></form>
  </section>

  <footer class="foot narrow"><div class="footrow"><div class="sync" id="sync"></div><button class="themebtn" id="themeBtn" data-a="theme" aria-label="Switch light or dark mode"></button></div></footer>
</div>

<script>
/* Theme: light, dark, or follow the device (default) */
const THEME_KEY="one-week-planner-theme";
function applyTheme(t){
  if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");
  const dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#141413":"#f7f5f8";

function place(from,id,target,pt){

    const {done,day,wk,kept,time,dur,...rest}=state.week.splice(i,1)[0];state.dump.unshift(rest);
    if(state.focus===id)state.focus=null;
  }else{
    const s=targetToSlot(target);if(!s)return;
    if(from==="dump"){const i=state.dump.findIndex(t=>t.id===id);if(i<0)return;state.week.push({...state.dump[i],done:false,...s});state.dump.splice(i,1)}
    else{const t=state.week.find(t=>t.id===id);if(!t)return;Object.assign(t,s);delete t.kept}

    if(t&&target.startsWith("time:")&&pt){const tl=$("tl").getBoundingClientRect();let m=Math.round((pt.y-(pt.off||0)-tl.top)/15)*15+TL_START;t.time=Math.max(TL_START,Math.min(TL_END-15,m));t.dur=t.dur||60}

  if(a==="view"){view=b.dataset.v;try{localStorage.setItem(VKEY,view)}catch(_){}menuId=null;render();scrollToday();return}
  if(a==="today"){sel=new Date(now.getFullYear(),now.getMonth(),now.getDate());render();scrollToday();return}
  if(a==="prev"||a==="next"){const s=a==="next"?1:-1;sel=view==="month"?new Date(sel.getFullYear(),sel.getMonth()+s,1):addDays(sel,view==="week"?7*s:s);menuId=null;render();scrollToday();return}
  if(a==="goDay"){if(e.target.closest(".mchip")&&false)return;sel=parse(b.dataset.d);view="day";menuId=null;render();scrollTo({top:0});return}
  if(a==="togglePast"){const d=b.dataset.d;openPast.has(d)?openPast.delete(d):openPast.add(d);render();return}
  if(a==="menu"){const k=b.dataset.k+id;menuId=menuId===k?null:k;colorOpen=null;render();return}
  if(a==="colors"){const k=b.dataset.k+id;colorOpen=colorOpen===k?null:k;menuId=null;render();return}
  if(a==="theme"){const dark=theme==="dark"||(theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);theme=dark?"light":"dark";try{localStorage.setItem(THEME_KEY,theme)}catch(_){}applyTheme(theme);return}
  if(a==="close"){menuId=null;render();return}
  if(a==="tlclick"){if(e.target.closest(".blk,.qadd,.blkmenu"))return;const tl=$("tl").getBoundingClientRect();const m=Math.min(TL_END-30,Math.floor((e.clientY-tl.top)/30)*30+TL_START);quick={d:ymd(sel),m};menuId=null;pendingFocus=`time:${quick.d}:${m}`;render();return}
  if(a==="untime"){const t=find("week",id);delete t.time;delete t.dur;menuId=null;save();render();return}
  if(a==="up")return place("dump",id,"any:"+(view==="month"?CUR:wkOf(sel)));
  if(a==="back")return place("week",id,"dump");
  if(a==="anyday"){const t=find("week",id);t.day=null;delete t.time;delete t.dur;menuId=null}
  else if(a==="check"){const t=find("week",id);t.done=!t.done;if(t.done&&state.focus===id)state.focus=null}
  else if(a==="cat"){find(b.dataset.k,id).c=b.dataset.c;colorOpen=null}
  else if(a==="focus")state.focus=state.focus===id?null:id;
  else if(a==="delw"){state.week=state.week.filter(t=>t.id!==id);menuId=null}
  else if(a==="del"){state.dump=state.dump.filter(t=>t.id!==id);menuId=null}
  else if(a==="delGoal")state.goals=state.goals.filter(t=>t.id!==id);
  else if(a==="delR")state.rhythm=state.rhythm.filter(t=>t.id!==id);
  else if(a==="day"){const r=state.rhythm.find(r=>r.id===id),d=+b.dataset.d,K=wkOf(sel),ds=r.log[K]||[];r.log[K]=ds.includes(d)?ds.filter(x=>x!==d):ds.concat(d)}
  else if(a==="carry")state.week.filter(t=>t.wk<CUR&&!t.done&&!t.kept).forEach(t=>{t.wk=CUR;t.day=null});
  else if(a==="staleDump"){const s=state.week.filter(t=>t.wk<CUR&&!t.done&&!t.kept);s.forEach(t=>{const {done,day,wk,kept,...r}=t;state.dump.unshift(r)});state.week=state.week.filter(t=>!s.includes(t))}
  else if(a==="staleKeep")state.week.filter(t=>t.wk<CUR&&!t.done&&!t.kept).forEach(t=>t.kept=true);
  else if(a==="signout"){sb&&sb.auth.signOut();return}
  else return;
  save();render();
});
document.addEventListener("keydown",e=>{
  const inp=e.target.closest&&e.target.closest("[data-add]");
  if(inp&&e.key==="Enter"){
    e.preventDefault();const v=inp.value.trim();if(!v)return;const tg=inp.dataset.add;
    if(tg.startsWith("time:")){const [,dd,mm]=tg.split(":");const dt=parse(dd);state.week.push({id:state.next++,text:v,c:"plain",done:false,wk:wkOf(dt),day:idxOf(dt),time:+mm,dur:60});quick=null;save();render();return}
    if(tg==="dump")state.dump.push({id:state.next++,text:v,c:"plain"});
    else{const s=targetToSlot(tg);state.week.push({id:state.next++,text:v,c:"plain",done:false,...s})}
    pendingFocus=tg;save();render();return;
  }
  const ed=e.target.closest&&e.target.closest("[data-edit]");
  if(ed&&e.key==="Enter"){e.preventDefault();commitEdit(ed);menuId=null;render()}
  if(e.key==="Escape"&&(menuId||quick)){menuId=null;quick=null;render()}
});
function commitEdit(ed){const t=find(ed.dataset.edit,+ed.dataset.id);const v=ed.value.trim();if(t&&v&&v!==t.text){t.text=v;save()}}
document.addEventListener("focusout",e=>{const q=e.target.closest&&e.target.closest(".qadd input");if(q&&!q.value.trim())setTimeout(()=>{if(quick&&!document.activeElement?.closest?.(".qadd")){quick=null;render()}},150)});
document.addEventListener("change",e=>{const ed=e.target.closest("[data-edit]");if(ed)commitEdit(ed)});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="gForm"){const v=$("gNew").value.trim();if(v){state.goals.push({id:state.next++,text:v});save();render();$("goalBox").open=true}}
  if(e.target.id==="rForm"){const v=$("rNew").value.trim();if(v){state.rhythm.push({id:state.next++,text:v,c:$("rCat").value,log:{}});save();render()}}
});

/* ---------- Drag and drop ----------
   Touch/pen: press the ⠿ handle and drag. Mouse: drag the row from anywhere. */
let drag=null, suppressClick=false, overEl=null, scrollTimer=null;
let resizing=null;
document.addEventListener("pointerdown",e=>{
  suppressClick=false;
  const rz=e.target.closest("[data-rsz]");
  if(rz){const t=find("week",+rz.dataset.rsz);resizing={t,el:rz.closest(".blk"),y0:e.clientY,d0:t.dur||60,pid:e.pointerId};e.preventDefault();try{rz.setPointerCapture(e.pointerId)}catch(_){}return}
  const src=e.target.closest("[data-drag]");
  if(!src||e.button>0)return;
  const onGrip=!!e.target.closest(".grip");
  if(e.target.closest(".chk,input,select"))return;
  if(e.pointerType!=="mouse"&&!onGrip)return;
  drag={src,from:src.dataset.drag,id:+src.dataset.id,x:e.clientX,y:e.clientY,active:false,pid:e.pointerId,grip:onGrip,off:src.classList.contains("blk")?e.clientY-src.getBoundingClientRect().top:12};
  if(onGrip){e.preventDefault();try{e.target.closest(".grip").setPointerCapture(e.pointerId)}catch(_){}}
});
function start(x,y){
  drag.active=true;
  const g=document.createElement("div");g.className="ghost";
  drag.label=(drag.src.querySelector(".hl,.btxt")||drag.src).textContent.trim();g.textContent=drag.label;
  document.body.appendChild(g);drag.ghost=g;
  drag.src.classList.add("lifting");moveGhost(x,y);
}
function moveGhost(x,y){
  drag.ghost.style.left=(x-24)+"px";drag.ghost.style.top=(y-18)+"px";
  const el=document.elementFromPoint(x,y);const tgt=el&&el.closest("[data-drop]");
  if(overEl!==tgt){overEl&&overEl.classList.remove("over");overEl=tgt;tgt&&tgt.classList.add("over")}
  if(tgt&&tgt.dataset.drop.startsWith("time:")){const tl=tgt.getBoundingClientRect();const m=Math.max(TL_START,Math.min(TL_END-15,Math.round((y-drag.off-tl.top)/15)*15+TL_START));drag.ghost.textContent=fmt(m)+" · "+drag.label}else drag.ghost.textContent=drag.label;
  clearInterval(scrollTimer);
  const vy=y<70?-14:y>innerHeight-70?14:0;
  if(vy)scrollTimer=setInterval(()=>scrollBy(0,vy),16);
}
document.addEventListener("pointermove",e=>{
  if(resizing&&e.pointerId===resizing.pid){e.preventDefault();const dur=Math.max(15,Math.round((resizing.d0+e.clientY-resizing.y0)/15)*15);resizing.dur=dur;resizing.el.style.height=dur+"px";const bt=resizing.el.querySelector(".btime");if(bt)bt.textContent=fmt(resizing.t.time)+" – "+fmt(resizing.t.time+dur);return}
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>(drag.grip?3:6))start(e.clientX,e.clientY);return}
  e.preventDefault();moveGhost(e.clientX,e.clientY);
},{passive:false});
document.addEventListener("touchmove",e=>{if(drag||resizing)e.preventDefault()},{passive:false});
function end(cancel,ev){
  if(resizing){const r=resizing;resizing=null;suppressClick=true;setTimeout(()=>suppressClick=false,60);if(!cancel&&r.dur){r.t.dur=Math.min(r.dur,TL_END-r.t.time);save()}render();return}
  if(!drag)return;clearInterval(scrollTimer);
  const d=drag;drag=null;if(!d.active)return;
  d.ghost.remove();d.src.classList.remove("lifting");overEl&&overEl.classList.remove("over");
  const t=overEl;overEl=null;suppressClick=true;setTimeout(()=>suppressClick=false,60);
  if(!cancel&&t)place(d.from,d.id,t.dataset.drop,ev?{y:ev.clientY,off:d.off}:null);
}
document.addEventListener("pointerup",e=>end(false,e));
document.addEventListener("pointercancel",e=>end(true,e));
document.addEventListener("contextmenu",e=>{if(e.target.closest(".grip"))e.preventDefault()});
let lastPhone=matchMedia("(max-width:720px)").matches;
addEventListener("resize",()=>{const p=matchMedia("(max-width:720px)").matches;if(p!==lastPhone){lastPhone=p;if(!drag)render()}});

render();scrollToday();applyTheme(theme);
</script>
</body></html>
